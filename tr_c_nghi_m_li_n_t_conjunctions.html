<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Tiếng Anh - Conjunctions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            min-height: 100vh;
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c7d2fe; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #818cf8; 
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        .btn-option {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-option:active {
            transform: scale(0.98);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: translate(-50%, -20px) scale(0.9); }
            100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .toast-anim {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }
    </style>

<body class="flex items-center justify-center p-4">

    <div id="login-view" class="glass-card rounded-3xl p-8 md:p-12 w-full max-w-md text-center transition-all duration-500">
        <div class="mb-6">
            <span class="text-6xl">🎓</span>
        </div>
        <h1 class="text-3xl font-extrabold text-indigo-900 mb-2">Thử Thách Tiếng Anh</h1>
        <p class="text-indigo-600 font-semibold mb-8">Chủ đề: Liên từ (Conjunctions)</p>
        
        <div class="space-y-4">

                Bắt Đầu Ngay 🚀
            </button>
        </div>
    </div>

            <div class="flex items-center gap-3">
                <div class="bg-indigo-100 text-indigo-800 px-4 py-2 rounded-lg font-bold">
                    🧑‍🎓 <span id="display-name">Học sinh</span>
                </div>
            </div>
            
            <div class="flex-1 w-full md:w-auto md:px-8">
                <div class="flex justify-between text-sm font-bold text-gray-500 mb-1">
                    <span>Tiến độ</span>
                    <span id="progress-text">0/146</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progress-bar" class="bg-gradient-to-r from-green-400 to-indigo-500 h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
                </div>
            </div>

            <div>
                <select id="quick-nav" onchange="jumpToQuestion(this.value)" class="bg-gray-50 border-2 border-indigo-100 text-indigo-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block w-full p-2.5 font-bold outline-none cursor-pointer">
                    <!-- Options populated by JS -->
                </select>
            </div>
        </div>

        <!-- Question Container -->
        <div class="flex-1 flex flex-col justify-center">
            <div class="mb-2 text-indigo-500 font-bold tracking-wider uppercase text-sm" id="exercise-label">Exercise 1</div>
            <h2 id="question-text" class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-8 leading-tight">
                Loading question...
            </h2>

            <div id="options-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Buttons populated by JS -->
            </div>

            <div id="hint-box" class="hidden mt-6 bg-amber-50 border-l-4 border-amber-500 p-4 rounded-xl shadow-sm transform transition-all duration-300">
                <div class="flex items-start gap-3">
                    <span class="text-amber-500 text-2xl">💡</span>
                    <div>
                        <h4 class="font-bold text-amber-800 mb-1">Gợi ý cho bạn:</h4>
                        <p id="hint-text" class="text-amber-700 text-sm font-semibold"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Next / Finish Button -->
        <div class="mt-8 flex justify-end">
            <button id="next-btn" onclick="handleNext()" class="hidden bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform hover:scale-105 active:scale-95 text-lg">
                Câu tiếp theo ➔
            </button>
            <button id="finish-btn" onclick="showReport()" class="hidden bg-gradient-to-r from-pink-500 to-orange-400 hover:from-pink-600 hover:to-orange-500 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform hover:scale-105 active:scale-95 text-lg">
                🎉 Xem Báo Cáo Hoàn Thành
            </button>
        </div>
    </div>

    <div id="report-view" class="glass-card rounded-3xl p-6 md:p-10 w-full max-w-4xl hidden flex-col">
        <div class="text-center mb-8">
            <span class="text-7xl block mb-4">🏆</span>
            <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-900 mb-2">Chúc Mừng <span id="report-name" class="text-pink-500"></span>!</h1>
            <p class="text-gray-600 font-semibold text-lg">Bạn đã hoàn thành xuất sắc bài kiểm tra Liên từ.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-indigo-50 rounded-2xl p-6 text-center border border-indigo-100">
                <div class="text-4xl font-black text-indigo-600 mb-1" id="stat-total">146</div>
                <div class="text-sm font-bold text-indigo-400 uppercase">Tổng số câu</div>
            </div>
            <div class="bg-green-50 rounded-2xl p-6 text-center border border-green-100">
                <div class="text-4xl font-black text-green-600 mb-1" id="stat-perfect">0</div>

            </div>
            <div class="bg-orange-50 rounded-2xl p-6 text-center border border-orange-100">

            </div>
        </div>

        function formatOptionText(text) {
            let lower = text.trim().toLowerCase();
            if (conjDictionary[lower]) {
                return `<span class="block">${text}</span><span class="text-sm font-semibold opacity-75 block mt-0.5 text-inherit">(${conjDictionary[lower]})</span>`;
            }
            return `<span>${text}</span>`;
        }

        function getHint(correctAnswerRaw) {
            if (!correctAnswerRaw) return "Hãy dịch nghĩa ngữ cảnh của câu để chọn liên từ phù hợp nhé.";
            const text = correctAnswerRaw.toLowerCase().trim();
            
            // Nhóm Cụm N/V-ing
            if (text.includes("because of") || text.includes("due to") || text.includes("owing to")) {
                 return "Câu này cần một từ nối chỉ NGUYÊN NHÂN đi kèm với CỤM DANH TỪ (Noun Phrase) hoặc V-ing, không phải một mệnh đề (Chủ ngữ + Động từ).";
            } else if (text.includes("in spite") || text.includes("despite")) {
                 return "Hai vế có ý nghĩa trái ngược nhau (mặc dù). Chú ý phía sau khoảng trống là một CỤM DANH TỪ hoặc V-ing, chứ không phải một mệnh đề (S+V) hoàn chỉnh.";
            } 
            // Nhóm Mệnh đề
            else if (text.includes("because") || text === "as" || text.includes("since")) {
                return "Cần một liên từ chỉ NGUYÊN NHÂN (bởi vì). Hãy chú ý phía sau khoảng trống là một MỆNH ĐỀ hoàn chỉnh (Chủ ngữ + Vị ngữ).";
            } else if (text.includes("although") || text.includes("though") || text.includes("even though")) {
                return "Câu mang ý nghĩa nhượng bộ, tương phản (mặc dù). Quan trọng: Phía sau khoảng trống là một MỆNH ĐỀ hoàn chỉnh (S + V).";
            } 
            // Kết quả, Tương phản
            else if (text.includes("so") && !text.includes("so that") && !text.includes("so long as") || text.includes("therefore")) {
                return "Mệnh đề chứa khoảng trống chỉ KẾT QUẢ của sự việc được nhắc đến trước đó (vì vậy, cho nên).";
            } else if (text.includes("but") || text.includes("yet") || text.includes("however") || text.includes("nevertheless")) {
                return "Khoảng trống cần một từ nối chỉ sự TƯƠNG PHẢN trực tiếp (nhưng, tuy nhiên) giữa hai ý tưởng trong câu.";
            } 
            // Thời gian
            else if (text.includes("when") || text.includes("while") || text.includes("as soon as") || text.includes("before") || text.includes("after") || text.includes("until") || text.includes("till")) {
                return "Câu này mô tả mốc THỜI GIAN. Hãy dịch nghĩa hai vế để xem hành động nào xảy ra trước/sau, hoặc song song (khi, trong khi, cho đến khi...).";
            } 
            // Điều kiện
            else if (text.match(/\bif\b/) || text.includes("unless") || text.includes("as long as") || text.includes("once") || text.includes("even if")) {
                return "Đây là câu mang ý nghĩa ĐIỀU KIỆN (nếu, trừ khi, ngay cả khi...). Thử dịch nghĩa để xem có phải một vế là điều kiện của vế kia không.";
            } 
            // Mục đích
            else if (text.includes("so that") || text.includes("in order to")) {
                return "Vế sau chỉ MỤC ĐÍCH của hành động phía trước (làm gì đó... để mà...).";
            } 
            // Cặp liên từ
            else if (text.includes("whether") || text.includes("either") || text.includes("neither") || text.includes("both")) {
                return "Chú ý các cấu trúc đi chung với nhau thành cặp (Ví dụ: either...or, neither...nor, whether...or) hoặc cấu trúc chỉ sự lựa chọn.";
            } 
            // Đại từ bất định
            else if (text.includes("whatever") || text.includes("whoever") || text.includes("wherever") || text.includes("whenever")) {
                return "Cần một đại từ/liên từ mang nghĩa 'bất cứ...' (bất cứ điều gì, bất cứ ai...).";
            } 
            // Default
            else {
                return "Hãy đọc kỹ toàn bộ câu để hiểu ngữ cảnh. Để ý xem phía sau chỗ trống là một Cụm danh từ hay một Mệnh đề (có chủ ngữ và động từ) để chọn đúng loại từ nhé.";
            }
        }

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value.trim();
            if (!nameInput) {
                showToast("Vui lòng nhập tên của bạn!", "error");
                return;
            }
            studentName = nameInput;
            document.getElementById('display-name').textContent = studentName;
            
            document.getElementById('login-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('hidden');
            document.getElementById('quiz-view').classList.add('flex');
            
            updateNavDropdown();
            renderQuestion(currentQIndex);
        }

        function renderQuestion(index) {
            const q = questions[index];
            const stats = userStats[index];
            
            // UI Updates
            document.getElementById('exercise-label').textContent = q.exercise + ` - Câu ${index + 1}/${questions.length}`;
            document.getElementById('question-text').textContent = q.text;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            const labels = ['A', 'B', 'C', 'D'];
            const hasValidAnswer = q.correctIndex !== undefined && q.correctIndex >= 0 && q.correctIndex <= 3;
            
            q.options.forEach((optText, optIdx) => {
                const btn = document.createElement('button');
                
                let isHighlightedAsCorrect = false;
                if (stats.completed) {
                    // Highlight the one they successfully selected
                    if (stats.selectedAnswer === optIdx) {
                        isHighlightedAsCorrect = true;
                    }
                }

                btn.className = `btn-option w-full text-left px-6 py-4 rounded-xl border-2 font-bold text-lg transition-all 
                                 ${isHighlightedAsCorrect ? 'bg-green-500 text-white border-green-500' : 'bg-white border-indigo-100 text-gray-700 hover:border-indigo-400 hover:shadow-md'} flex items-center`;
                
                // If question already completed, disable buttons
                if(stats.completed) {
                    btn.disabled = true;
                    if (!isHighlightedAsCorrect) btn.classList.add('opacity-50');
                } else {
                    btn.onclick = () => handleAnswer(optIdx, btn);
                }

                const formattedText = formatOptionText(optText);
                const labelBg = isHighlightedAsCorrect ? 'bg-white text-green-600' : 'bg-indigo-100 text-indigo-800';
                
                btn.innerHTML = `<span class="inline-block w-8 h-8 text-center leading-8 rounded-full ${labelBg} mr-4 flex-shrink-0">${labels[optIdx]}</span> 
                                 <div class="flex-1">${formattedText}</div>`;
                optionsContainer.appendChild(btn);
            });

            // Ẩn hộp gợi ý khi sang câu mới
            document.getElementById('hint-box').classList.add('hidden');

            // Update Progress
            const completedCount = userStats.filter(s => s.completed).length;
            document.getElementById('progress-text').textContent = `${completedCount}/${questions.length}`;
            document.getElementById('progress-bar').style.width = `${(completedCount / questions.length) * 100}%`;

            // Setup buttons
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('finish-btn').classList.add('hidden');

            if (stats.completed) {
                if (completedCount === questions.length) {
                    document.getElementById('finish-btn').classList.remove('hidden');
                } else {
                    document.getElementById('next-btn').classList.remove('hidden');
                }
            }
            
            // Sync dropdown
            document.getElementById('quick-nav').value = index;
        }

        function handleAnswer(optIdx, btnElement) {
            const answeredIndex = currentQIndex;
            const q = questions[currentQIndex];
            const stats = userStats[currentQIndex];
            
            if (stats.completed) return; // Prevent double clicks

            stats.tries++;

            // Fallback: If correctIndex is missing or invalid, accept the chosen answer
            const hasValidAnswer = q.correctIndex !== undefined && q.correctIndex >= 0 && q.correctIndex <= 3;
            const isCorrect = hasValidAnswer ? (optIdx == q.correctIndex) : true;

            if (isCorrect) {
                // Correct!
                stats.completed = true;
                stats.selectedAnswer = optIdx;
                if (stats.firstTryCorrect === null) stats.firstTryCorrect = true;
                
                showToast("Chính xác! Làm tốt lắm 🌟", "success");
                
                // Styling correct button
                btnElement.classList.remove('bg-white', 'text-gray-700', 'border-indigo-100', 'hover:border-indigo-400', 'bg-red-100', 'border-red-400', 'text-red-700');
                btnElement.classList.add('bg-green-500', 'text-white', 'border-green-500');
                btnElement.querySelector('span:first-child').className = 'inline-block w-8 h-8 text-center leading-8 rounded-full bg-white text-green-600 mr-4 flex-shrink-0';
                
                // Hide hint box if correct
                document.getElementById('hint-box').classList.add('hidden');
                
                // Update dropdown text immediately
                updateNavDropdown();
                
                // Disable all buttons
                const allBtns = document.getElementById('options-container').querySelectorAll('button');
                allBtns.forEach(b => {
                    b.disabled = true;
                    if(b !== btnElement) b.classList.add('opacity-50');
                });

                // Show next or finish
                const completedCount = userStats.filter(s => s.completed).length;
                document.getElementById('progress-text').textContent = `${completedCount}/${questions.length}`;
                document.getElementById('progress-bar').style.width = `${(completedCount / questions.length) * 100}%`;

                if (completedCount === questions.length) {
                    document.getElementById('finish-btn').classList.remove('hidden');
                } else {
                    document.getElementById('next-btn').classList.remove('hidden');
                }

                // Hiệu ứng pháo giấy cổ vũ
                if (window.confetti) {
                    confetti({
                        particleCount: 150,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#26ccff', '#a25afd', '#ff5e7e', '#88ff5a', '#fcff42', '#ffa62d', '#ff36ff'],
                        zIndex: 1000
                    });
                }

                // Tự động chuyển câu sau 2 giây (để học sinh kịp nhìn đáp án)
                setTimeout(() => {
                    // Chỉ tự động chuyển nếu người dùng chưa tự bấm qua câu khác (qua Quick Nav)
                    if (currentQIndex === answeredIndex) {
                        if (completedCount === questions.length) {
                            showReport();
                        } else {
                            handleNext();
                        }
                    }
                }, 2000);

            } else {
                // Wrong
                if (stats.firstTryCorrect === null) stats.firstTryCorrect = false;
                showToast("Chưa đúng rồi, hãy thử lại nhé! 🧐", "error");
                
                btnElement.classList.remove('bg-white', 'border-indigo-100');
                btnElement.classList.add('bg-red-100', 'border-red-400', 'text-red-700', 'shake-anim');
                setTimeout(() => btnElement.classList.remove('shake-anim'), 400);

                // Hiển thị gợi ý
                const hintBox = document.getElementById('hint-box');
                const hintText = document.getElementById('hint-text');
                const correctAnswerStr = q.options[q.correctIndex] || "";
                hintText.textContent = getHint(correctAnswerStr);
                hintBox.classList.remove('hidden');
            }
        }

        function handleNext() {
            // Find next unanswered question
            let nextIndex = currentQIndex + 1;
            while(nextIndex < questions.length && userStats[nextIndex].completed) {
                nextIndex++;
            }
            // If we reached the end but missed some in the middle, loop back to find first unanswered
            if (nextIndex >= questions.length) {
                nextIndex = userStats.findIndex(s => !s.completed);
            }

            if (nextIndex !== -1) {
                currentQIndex = nextIndex;
                renderQuestion(currentQIndex);
            }
        }

        function jumpToQuestion(index) {
            currentQIndex = parseInt(index);
            renderQuestion(currentQIndex);
        }

        function updateNavDropdown() {
            const select = document.getElementById('quick-nav');
            select.innerHTML = '';
            questions.forEach((q, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${userStats[i].completed ? '✅ ' : ''}${q.exercise.replace('Exercise', 'Ex')} - Q${i + 1}`;
                if (i === currentQIndex) opt.selected = true;
                select.appendChild(opt);
            });
        }

        function showReport() {
            document.getElementById('quiz-view').classList.add('hidden');
            document.getElementById('quiz-view').classList.remove('flex');
            document.getElementById('report-view').classList.remove('hidden');
            document.getElementById('report-view').classList.add('flex');

            document.getElementById('report-name').textContent = studentName;

            const perfectCount = userStats.filter(s => s.firstTryCorrect).length;
            const redoCount = questions.length - perfectCount;

            document.getElementById('stat-perfect').textContent = perfectCount;
            document.getElementById('stat-redo').textContent = redoCount;

            const mistakesList = document.getElementById('mistakes-list');
            mistakesList.innerHTML = '';
            
            if (redoCount > 0) {
                document.getElementById('mistakes-container').classList.remove('hidden');
                
                questions.forEach((q, i) => {
                    if (!userStats[i].firstTryCorrect) {
                        const item = document.createElement('div');
                        item.className = 'p-4 mb-3 bg-red-50 rounded-lg border border-red-100';
                        const labels = ['A', 'B', 'C', 'D'];
                        const correctText = (q.correctIndex !== undefined && q.correctIndex >= 0 && q.correctIndex <= 3) 
                            ? `${labels[q.correctIndex]}. ${q.options[q.correctIndex]}`
                            : "Câu này không có đáp án chuẩn, mọi lựa chọn đều được chấp nhận.";
                            
                        item.innerHTML = `
                            <p class="font-bold text-gray-800 mb-2">${q.exercise} - Câu ${i+1}: ${q.text}</p>
                            <p class="text-green-700 font-semibold flex items-center gap-2">
                                ✅ Đáp án đúng: ${correctText}
                            </p>
                            <p class="text-sm text-gray-500 mt-1">Số lần thử: ${userStats[i].tries}</p>
                        `;
                        mistakesList.appendChild(item);
                    }
                });
            }
        }

        function showToast(msg, type) {
            // Remove existing toasts
            const existing = document.querySelectorAll('.toast-msg');
            existing.forEach(e => e.remove());

            const toast = document.createElement('div');
            toast.className = `toast-msg toast-anim fixed top-10 left-1/2 transform -translate-x-1/2 px-8 py-4 rounded-full text-white font-bold shadow-2xl z-50 flex items-center gap-3 ${type === 'success' ? 'bg-gradient-to-r from-green-400 to-green-600' : 'bg-gradient-to-r from-red-500 to-pink-600'}`;
            
            toast.innerHTML = type === 'success' 
                ? `<span>🎉</span> <span>${msg}</span>` 
                : `<span>⚠️</span> <span>${msg}</span>`;

            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translate(-50%, -20px) scale(0.9)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
